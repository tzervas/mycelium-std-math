[package]
name = "mycelium-std-math"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "std.math — Ring-2 / Tier-B numeric functions over the honest numerics (M-525)"
publish = false

[dependencies]
mycelium-core = { git = "https://github.com/tzervas/mycelium-core", rev = "57ef45b453eef1f02bdfb1f0cad1034dabd32b1f" }
mycelium-std-core = { git = "https://github.com/tzervas/mycelium-std-core", rev = "f8db1265d973c86e422f1d49678e00b45b4f9a9b" }
mycelium-numerics = { git = "https://github.com/tzervas/mycelium-value", rev = "fd4c3b307918fe6d58251a0b24a81e9f384d65ba" }
mycelium-std-numerics = { git = "https://github.com/tzervas/mycelium-std-numerics", rev = "02596ec1d04e8b575944f09ca7003120d4704f73" }

[lints]
workspace = true

# --- standalone workspace root (course-correction Phase B, 2026-07-18; steer handoff §6.2) ---
[workspace]

[workspace.package]
version = "0.464.0"
edition = "2021"
rust-version = "1.96.1"
license = "MIT"
repository = "https://github.com/tzervas/mycelium-std-math"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"

[workspace.lints.rust]
# ADR-014: unsafe permitted-but-documented; the check is clippy::undocumented_unsafe_blocks.
unsafe_code = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

# G2 never-silent arithmetic: release builds panic on overflow (monorepo parity).
[profile.release]
overflow-checks = true
